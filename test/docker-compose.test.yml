# E2E test stack: the app (mock LLM, fresh database every run) plus a Playwright runner.
#
#   docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
#   docker compose -f test/docker-compose.test.yml down -v
#
# The HTML report and traces land in test/playwright-report and test/test-results.
name: finally-e2e

services:
  # Not named "app": Chromium's HSTS preload list covers the .app TLD and would force https://app:8000.
  finally-app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
      OPENROUTER_API_KEY: ""
    # No named volume. tmpfs over /app/db (which the image declares as a VOLUME) so that even a
    # recreated container never reuses an old anonymous volume: every run starts with a fresh DB.
    tmpfs:
      - /app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    depends_on:
      finally-app:
        condition: service_healthy
    working_dir: /e2e
    environment:
      BASE_URL: http://finally-app:8000
      CI: ""
    volumes:
      - .:/e2e
      # Keep the container's Linux node_modules separate from any host install.
      - /e2e/node_modules
    ipc: host
    command: ["/bin/sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
